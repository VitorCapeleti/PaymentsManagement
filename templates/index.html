<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spac-Y - Gerenciador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <style>
        table th { background-color: #f3f4f6; border: 1px solid #d1d5db; padding: 4px 8px; font-weight: bold; }
        table td { border: 1px solid #d1d5db; padding: 4px 8px; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <header class="bg-purple-700 text-white p-2 shadow-md flex items-center gap-4 text-sm">
        <h1 class="font-bold text-lg mr-4">📊 Spac-Y</h1>
        <form hx-post="/" hx-target="#workspace" hx-encoding="multipart/form-data" class="flex gap-2 items-center">
            <input type="file" name="archive" accept=".csv" class="text-xs bg-white text-black p-1 rounded w-56">
            <span class="text-sm font-bold">OU</span>
            <input type="text" name="archiveName" placeholder="Criar novo (ex: dados)..." class="text-black px-2 py-1 rounded border-none w-36 text-xs">
            <button type="submit" class="bg-purple-600 hover:bg-purple-500 px-3 py-1 rounded border border-purple-500 shadow text-xs font-bold">Carregar</button>
        </form>

        <div class="h-6 w-px bg-purple-500 mx-2"></div> <form hx-post="/" hx-target="#workspace" class="flex gap-2 items-center" id="graphForm">
             </form>
        <form hx-post="/" hx-target="#workspace" class="flex gap-2 items-center" id="graphForm">
            <label>Exibição:</label>
            <select name="graphType" hx-post="/" hx-target="#workspace" class="text-black px-2 py-1 rounded border-none">
                <option value="barH">Gráfico de Barras</option>
                <option value="pie">Pizza</option>
                <option value="line">Linha</option>
            </select>
        </form>
    </header>

    <main id="workspace" class="flex-1 p-4 flex gap-4 overflow-hidden">
        {% include 'partials/workspace.html' %}
    </main>

</body>
</html>
