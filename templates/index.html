<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Management</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header>
        <h1>Payments Management</h1>
    </header>
    <main>
        <div class="container-center">
            <form action="" method="POST" class="form-container">
                <div class="form-header">
                    <div class="form-header-item">
                        <label for="archive">Deseja carregar um arquivo?</label>
                        <input type="file" name="archive" id="archive" accept=".csv">
                    </div>
                    <div class="form-header-item">
                        <label for="archiveName">Crie um novo Arquivo: </label>
                        <input type="text" name="archiveName" id="archiveName" placeholder="Nome do arquivo (.csv)">
                    </div>
                        <div class="form-header-item">
                        <label for="graphType">Selecione o tipo de gráfico: </label>
                        <select name="graphType" id="graphType">
                            <option value="barH" selected>BarraH</option>
                            <option value="pie">Pizza</option>
                            <option value="line">Linha</option>
                            <option value="dashboard">Dashboard Completo</option>
                        </select>
                    </div>
                </div>
                <div class="header-group">
                    <label for="name">Nome</label>
                    <label for="amount">Valor</label>
                    <label for="date">Data</label>
                    <label for="category">Categoria</label>
                </div>
                <div id="container-itens">
                </div>
                <div class="form-buttons">
                    <button type="button" onclick="addInputs()">Adicionar outro item</button>
                    <button type="submit">Enviar dados</button>
                </div>
            </form>
            <img src="data:image/png;base64,{{ graphBase64 }}" alt="Gráfico Matplotlib" class="matplot-img">
            <span>{{ message }}</span>
        </div>
        
    </main>
    <script>
        function addInputs() {
            const container = document.getElementById('container-itens');
            const newInputGroup = document.createElement('div');
            newInputGroup.id = 'input-group';
            newInputGroup.innerHTML = `
                <input type="text" name="name" id="name">
                <input type="number" step="0.01" name="amount" id="amount">
                <input type="date" name="date" id="date">
                <input type="text" name="category" id="category">
            `;
            newInputGroup.querySelectorAll('input').forEach(input => input.value = '');
            container.appendChild(newInputGroup);
        }
    </script>
</body>
</html>
